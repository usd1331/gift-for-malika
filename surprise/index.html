Я очень сильно тебя люблю, я очень счастлив, что ты появилась в моей жизни. Я безумно благодарен тебе за всё, что каждый день ты рядом со мной, поддерживаешь меня, тоже стараешься ради нас, я очень ценю это.

Каждый раз, когда я вижу тебя, в моих глазах зажигается искра, одно лишь слово твое избавляет от всех проблем. Каждое утро, думая о тебе, улыбка сама непроизвольно появляется на моем лице.

Я правда очень сильно скучаю по тебе, я уже жду не дождусь нашей встречи, вновь почувствовать тебя рядом со мной, посмотреть на твою нежную улыбку, твои яркие глаза, твои шелковистые волосы, посмотреть на то, как ты напрягаешь свой носик, пока о чем-то увлекательно рассказываешь, помогать тебе тогда, когда говоришь, что справишься сама, и услышать твой сладкий запах.

Ты мой нежный рассвет, мой закат, моя радость и мое наслаждение. Ты мое спокойствие, и ты же мой азарт. Я хочу с тобой мечтать, писать слова любви на первом снеге и счастья большего не знать, да и просто помолчать и понимать тебя с полувзгляда, с тобою миг становится наградой.

Береги себя, Малика ❤️
